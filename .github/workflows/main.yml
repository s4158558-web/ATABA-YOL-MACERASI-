name: Build ATABA Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Play Store project
        run: |
          unzip -o ATABA_Yol_Macerasi_PlayStore_API36_HAZIR.zip -d ataba

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release AAB
        working-directory: ataba/ataba_play
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ATABA-PlayStore-AAB
          path: ataba/ataba_play/app/build/outputs/bundle/release/app-release.aab
